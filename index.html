/* Convert to Set for fast lookup */
const TNPSC_SET = new Set(
  TNPSC_SHORTLIST_RAW.trim().split(/\s+/)
);

/* ================================
   MAIN CHECK FUNCTION
   ================================ */

function checkTNPSC() {
  const roll = document.getElementById("tnpscRoll").value.trim();
  const mobile = document.getElementById("tnpscMobile").value.trim();

  if (!/^\d{10}$/.test(roll)) {
    showTNPSC("Please enter a valid Register Number.", false);
    return;
  }

  if (!/^[6-9]\d{9}$/.test(mobile)) {
    showTNPSC("Please enter a valid 10-digit mobile number.", false);
    return;
  }

  const found = TNPSC_SET.has(roll);

  showTNPSC(
    found
      ? `✔ ELIGIBLE: Register Number ${roll} is admitted to Main Examination.`
      : `✖ NOT ELIGIBLE: Register Number ${roll} is not in the list.`,
    found
  );

  // ✅ SEND LEAD TO GOOGLE SHEET
  sendToSheet(
    mobile,
    roll,
    found ? "Eligible" : "Not Eligible"
  );
}

/* ================================
   UI MESSAGE HANDLER
   ================================ */

function showTNPSC(msg, success) {
  const box = document.getElementById("tnpscResult");
  box.style.background = success ? "#dcfce7" : "#fee2e2";
  box.style.color = success ? "#166534" : "#991b1b";
  box.innerText = msg;
}

/* ================================
   GOOGLE SHEET INTEGRATION
   ================================ */

function sendToSheet(mobile, roll, result) {
  const fd = new FormData();
  fd.append("mobile", mobile);
  fd.append("roll", roll);
  fd.append("result", result);
  fd.append("exam", "TNPSC Group 2");

  fetch(
    "https://script.google.com/macros/s/AKfycbz9fnV__Vck0qfhgdW75FvGxqaQvDYS-96C77GKS9x-KT8682oGy0udREHVEB2Zy54uaA/exec",
    {
      method: "POST",
      body: fd
    }
  ).catch(() => {});
}
